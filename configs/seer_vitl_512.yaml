# Seer hero recipe - DINOv3 ViT-L continuation training on the full
# public data mixture. ~302M parameters (15% of the 2B budget).
# Best run on an A100/H100 class GPU; see seer_vitl_local.yaml for 12GB.
#
# Full mix + fetch commands: docs/DATA_MIXTURE.md
# The mixture mirrors Pangram Image's data strategy:
#   * comfor        - 4,803 open generators (diversity drives generalization,
#                     CVPR 2025) + paired real images
#   * flux-reason   - FLUX.1-dev fakes (LucasFang/FLUX-Reason-6M), streamed
#   * frontier-fakes - Midjourney / DALL-E / SD / Nano Banana Pro fakes only
#                     (ClassLabel on that repo is inverted: 0=fake, 1=real)
#   * sid-set       - SID_Set full-synthetic only (drop reals and tampered)
#   * ntire         - NTIRE 2026 train, all 6 shards (42 gens, matched reals)
#   * gs-images-v3/v4 - GAS-Station dumps after scripts/wire_gasstation.py
#   * openfake      - the 30 OpenFake generators this detector actually
#                     misses, plus its LAION/Pexels reals
#   * laion400m-1   - jp1924/Laion400m-1 hosted images (min side >512)
#   * open-images-v7 - Open Images V7 validation+test reals
#
# Weights are relative sampling probabilities, tuned for three goals:
#   1. recency - the most recent fake sources carry the most fake mass:
#      ntire (42 gens 2022-2026, ~28% of fake draws), openfake (~16%,
#      frontier commercial APIs through 2026), and the GAS-Station
#      weekly dumps (v3 ~9% / v4 ~10%).
#   2. measured difficulty - openfake's share is spent on generators a
#      trained checkpoint demonstrably misses, not on breadth for its own
#      sake. scripts/openfake_rank.py scores every OpenFake generator and
#      scripts/openfake.py fetches inversely to recall, so nano-banana
#      (0.20 recall) and qwen-image (0.41) arrive with 8k images each while
#      anything already caught above 98% is not fetched at all.
#   3. balance - no source above ~25% of a class. comfor fakes
#      (SD-derivative heavy, older skew) hold ~22% to preserve the
#      4,803-generator diversity that drives unseen-generator
#      generalization, plus its paired reals; frontier-fakes drops to ~5%
#      because openfake covers the same commercial families with 130k
#      unique images instead of a ~5k pool repeated ~27 times.
# Real mass comes from comfor, ntire, openfake, laion400m-1 and
# open-images-v7. laion400m-1 is the largest dedicated real-only
# source (web photos, min side >512) — FPR on in-the-wild reals is
# the failure mode this mix is trying to close. `balance_labels`
# then draws real/fake 50/50; weights apply within class.

# Gated: request access on the model page, then `hf auth login`.
backbone: facebook/dinov3-vitl16-pretrain-lvd1689m
pretrained: true
res: 512
batch_size: 54
grad_accum: 2               # effective batch 108; loss is averaged over the microbatches
max_steps: 60000
lr: 5.0e-5              # peak backbone LR (top layers after warmup; LLRD scales earlier)
head_lr: 1.0e-4
llrd: 0.8
optimizer: adamw
attn_implementation: auto   # FA4→FA3→FA2 if installed, else PyTorch SDPA
weight_decay: 0.05
warmup_steps: 1000
bf16: true
grad_checkpointing: false  # not needed on big GPUs
ema_decay: 0.999
eval_every: 2000
# ntire_test: HF deepfakesMSU/NTIRE-RobustAIGenDetection-test-public.
# openfake_test: OpenFake core/test - generators AND real sources both unseen
# (scripts/openfake.py holdout). Skipped with a log line until it is on disk.
eval_datasets: [ntire_test, openfake_test]
log_every: 50
heatmap_every: 50
heatmap_n: 4
ckpt_every: 500             # last.pt between evals (cgroup RAM can SIGKILL this job)
misclass_every: 2000        # FP/FN JPEGs + provenance from every source
misclass_max: 64            # worst errors per kind (fp/fn) per split
out_dir: runs/seer_vitl

data:
  source: mixture
  val_max_samples: 4096   # ~455 per source, class-balanced; held out of train
  balance_labels: true  # 50/50 real/fake, then weights within each class
  sources:
    - name: comfor
      type: comfor
      dataset: OwensLab/CommunityForensics-Small   # train only; Eval is held out
      split: train
      local_dirs: [/workspace/data/commfor-small]
      shuffle_buffer: 8192
      weight: 0.22            # ~22% of fake mass + its paired reals

    - name: flux-reason
      type: hf
      dataset: LucasFang/FLUX-Reason-6M
      image_col: image
      label: 1                 # every row is FLUX.1-dev
      local_dirs: [/workspace/data/flux-reason-6m]
      shuffle_buffer: 2048
      weight: 0.05            # single 2024 family; kept below sid-set

    - name: frontier-fakes
      type: hf
      dataset: julienlucas/midjourney-dalle-sd-nanobananapro-dataset
      split: train
      image_col: image
      label_col: label
      # repo ClassLabel: 0=fake, 1=real — invert onto our 0=real / 1=fake
      label_map: {0: 1, 1: 0, fake: 1, real: 0}
      keep_label: 1            # fake images only
      local_dirs: [/workspace/data/frontier-fakes]
      shuffle_buffer: 1024
      weight: 0.05            # only ~5k train fakes; openfake now carries
                              # the frontier-commercial load with 130k unique

    - name: sid-set
      type: hf
      dataset: saberzl/SID_Set
      split: train
      image_col: image
      label_col: label
      # 0=real, 1=full synthetic, 2=tampered — keep synthetic only
      label_map: {0: 0, 1: 1}
      keep_label: 1
      local_dirs: [/workspace/data/sid-set]
      shuffle_buffer: 2048
      weight: 0.05            # untagged, older-skew generators

    - name: ntire
      type: ntire
      split: train
      shard: -1                 # all 6 distribution-matched shards
      weight: 0.28              # most recent curated set; 42 gens 2022-2026 + matched reals

    - name: gs-images-v3
      type: folders             # run: scripts/wire_gasstation.py
      fake_dirs: [/workspace/data/gs-images-v3/wired/images.txt]
      weight: 0.09              # recent open-model dumps

    - name: gs-images-v4
      type: folders
      fake_dirs: [/workspace/data/gs-images-v4/wired/images.txt]
      weight: 0.10              # latest weekly dumps - highest recency

    - name: openfake
      type: folders             # run: scripts/openfake.py fetch --from-rank ...
      # ONLY openfake/train. core/test and reddit/test are held out and the
      # loader refuses any path under openfake/holdout_*.
      fake_dirs: [/workspace/data/openfake/train/fake]
      real_dirs: [/workspace/data/openfake/train/real]
      weight: 0.16              # ~16% of fake mass: 30 generators selected by
                                # measured recall, incl. nano-banana,
                                # qwen-image, ideogram-3.0, flux.2-klein-4b.
                                # Reals are LAION+Pexels (news / clean stock),
                                # where this detector's FPR was ~6-9%.

    - name: laion400m-1
      type: folders             # jp1924/Laion400m-1; scripts/download_laion400m.py
      real_dirs: [/workspace/data/laion400m-1/real]
      weight: 0.16              # ~18% of real mass; match openfake so
                                # web-crawl reals are not a footnote

    - name: open-images-v7
      type: folders             # scripts/download_open_images.py (val + test)
      real_dirs: [/workspace/data/open-images-v7]
      weight: 0.09

augment:
  # Train harder than the eval table (NTIRE 2026 / arxiv:2604.11487).
  # Eval `--perturbation all` stays JPEG 90/70/50/30, blur 0.5/1/2,
  # resize 0.5×/0.25×, noise 0.02/0.05/0.10, jitter ±20%, crop 80%.
  # Extras also wipe generator fingerprints: DCT grid-shift JPEG,
  # resample-kernel mismatch, FFT phase noise, chroma-only noise,
  # recapture warp, surface blur, stacked JPEG/WebP, messenger re-encode.
  jpeg_prob: 0.70
  jpeg_quality: [90, 70, 50, 30, 20, 10, 5]
  webp_prob: 0.18
  webp_quality: [20, 40, 60, 80]
  blur_sigma: [0.5, 1.0, 2.0, 4.0]
  noise_levels: [0.02, 0.05, 0.10, 0.20]
  downscale_levels: [0.5, 0.25, 0.125]
  color_jitter: 0.35           # +/-35% (eval table is +/-20%)
  center_crop_prob: 0.15       # crop 80%
  downscale_prob: 0.35
  extra_distort_prob: 0.55
  extra_distort_max: 4

composite:
  prob: 0.60                 # more fakes become overlays
  fake_on_real: 0.50
  real_on_fake: 0.35         # inverted labels — as important as FoR
  fake_on_fake: 0.15         # keep some seam-negative
  real_real_fraction: 0.20   # RoR ≈ 12% of reals; do not match `prob`
  max_overlays: 3            # n ~ Uniform{1,...,k} pastes per composite
  patch_loss_weight: 1.0
  balance_patch: true            # pos_weight = n_real_patches / n_fake_patches
  mode: mixed                # blend (seamless) + paste (hard overlay)
