# Seer hero recipe - DINOv3 ViT-L continuation training on the full
# public data mixture. ~302M parameters (15% of the 2B budget).
# Best run on an A100/H100 class GPU; see seer_vitl_local.yaml for 12GB.
#
# Full mix + fetch commands: docs/DATA_MIXTURE.md
# The mixture mirrors Pangram Image's data strategy:
#   * comfor        - 4,803 open generators (diversity drives generalization,
#                     CVPR 2025) + paired real images
#   * flux-reason   - FLUX.1-dev fakes (LucasFang/FLUX-Reason-6M), streamed
#   * frontier-fakes - Midjourney / DALL-E / SD / Nano Banana Pro fakes only
#                     (ClassLabel on that repo is inverted: 0=fake, 1=real)
#   * sid-set       - SID_Set full-synthetic only (drop reals and tampered)
#   * ntire         - NTIRE 2026 train, all 6 shards (42 gens, matched reals)
#   * gs-images-v3/v4 - GAS-Station dumps after scripts/wire_gasstation.py
#   * laion400m-1   - jp1924/Laion400m-1 hosted images (min side >512)
#   * open-images-v7 - Open Images V7 validation+test reals
#
# Weights are relative sampling probabilities, tuned for two goals:
#   1. recency - the most recent fake sources carry the most fake mass:
#      ntire (42 gens 2022-2026, ~22% of fake draws), the GAS-Station
#      weekly dumps (v3 ~15% / v4 ~16%) and frontier-fakes incl. Nano
#      Banana Pro (~12%, capped by its tiny ~5k-image train split).
#   2. balance - no fake source above ~22% of the fake class. comfor
#      fakes (SD-derivative heavy, older skew) stay ~19% but keep
#      enough weight to preserve the 4,803-generator diversity that
#      drives unseen-generator generalization, plus its 278k paired
#      reals; sid-set (~9%) has untagged, mostly older generators;
#      flux-reason (~7%) is a single FLUX.1-dev family.
# Real mass comes from comfor, ntire, laion400m-1, and open-images-v7.
# `balance_labels` then draws real/fake 50/50; weights apply within class.

backbone: facebook/dinov3-vitl16-pretrain-lvd1689m  # gated: accept license + hf auth login
pretrained: true
res: 512
batch_size: 54
grad_accum: 2               # effective batch 108; loss is averaged over the microbatches
max_steps: 60000
lr: 5.0e-5              # peak backbone LR (top layers after warmup; LLRD scales earlier)
head_lr: 1.0e-4
llrd: 0.8
optimizer: adamw
attn_implementation: auto   # FA4→FA3→FA2 if installed, else PyTorch SDPA
weight_decay: 0.05
warmup_steps: 1000
bf16: true
grad_checkpointing: false  # not needed on big GPUs
ema_decay: 0.999
eval_every: 2000
eval_datasets: [ntire_test]   # HF deepfakesMSU/NTIRE-RobustAIGenDetection-test-public
log_every: 50
heatmap_every: 50
heatmap_n: 4
ckpt_every: 500             # last.pt between evals (cgroup RAM can SIGKILL this job)
out_dir: runs/seer_vitl

data:
  source: mixture
  val_max_samples: 4096
  balance_labels: true  # 50/50 real/fake, then weights within each class
  sources:
    - name: comfor
      type: comfor
      dataset: OwensLab/CommunityForensics-Small   # train only; Eval is held out
      split: train
      local_dirs: [/workspace/data/commfor-small]
      shuffle_buffer: 8192
      weight: 0.26            # ~19% of fake mass + 0.13 reals (was 0.35)

    - name: flux-reason
      type: hf
      dataset: LucasFang/FLUX-Reason-6M
      image_col: image
      label: 1                 # every row is FLUX.1-dev
      local_dirs: [/workspace/data/flux-reason-6m]
      shuffle_buffer: 2048
      weight: 0.05            # single 2024 family; kept below sid-set

    - name: frontier-fakes
      type: hf
      dataset: julienlucas/midjourney-dalle-sd-nanobananapro-dataset
      split: train
      image_col: image
      label_col: label
      # repo ClassLabel: 0=fake, 1=real — invert onto our 0=real / 1=fake
      label_map: {0: 1, 1: 0, fake: 1, real: 0}
      keep_label: 1            # fake images only
      local_dirs: [/workspace/data/frontier-fakes]
      shuffle_buffer: 1024
      weight: 0.08            # frontier commercial; capped by ~5k train fakes

    - name: sid-set
      type: hf
      dataset: saberzl/SID_Set
      split: train
      image_col: image
      label_col: label
      # 0=real, 1=full synthetic, 2=tampered — keep synthetic only
      label_map: {0: 0, 1: 1}
      keep_label: 1
      local_dirs: [/workspace/data/sid-set]
      shuffle_buffer: 2048
      weight: 0.06            # untagged, older-skew generators

    - name: ntire
      type: ntire
      split: train
      shard: -1                 # all 6 distribution-matched shards
      weight: 0.30              # most recent curated set; 42 gens 2022-2026 + matched reals

    - name: gs-images-v3
      type: folders             # run: scripts/wire_gasstation.py
      fake_dirs: [/workspace/data/gs-images-v3/wired/images.txt]
      weight: 0.10              # recent open-model dumps

    - name: gs-images-v4
      type: folders
      fake_dirs: [/workspace/data/gs-images-v4/wired/images.txt]
      weight: 0.11              # latest weekly dumps - highest recency

    - name: laion400m-1
      type: folders             # jp1924/Laion400m-1; scripts/download_laion400m.py
      real_dirs: [/workspace/data/laion400m-1/real]
      weight: 0.10

    - name: open-images-v7
      type: folders             # scripts/download_open_images.py (val + test)
      real_dirs: [/workspace/data/open-images-v7]
      weight: 0.10

augment:
  # benchmark robustness levels (GenImage / OmniAID / Pangram protocols)
  jpeg_prob: 0.75
  jpeg_quality: [90, 70, 50, 30]
  blur_sigma: [0.5, 1.0, 2.0]
  noise_levels: [0.02, 0.05, 0.10]
  downscale_levels: [0.5, 0.25]
  color_jitter: 0.2            # +/-20%
  center_crop_prob: 0.15       # crop 80%
  downscale_prob: 0.30

composite:
  prob: 0.60                 # more fakes become overlays
  fake_on_real: 0.50
  real_on_fake: 0.35         # inverted labels — as important as FoR
  fake_on_fake: 0.15         # keep some seam-negative
  real_real_fraction: 0.20   # RoR ≈ 12% of reals; do not match `prob`
  max_overlays: 3            # n ~ Uniform{1,...,k} pastes per composite
  patch_loss_weight: 1.0
  balance_patch: true            # pos_weight = n_real_patches / n_fake_patches
  mode: mixed                # blend (seamless) + paste (hard overlay)
