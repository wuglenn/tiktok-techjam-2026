# Seer hero recipe - DINOv3 ViT-L continuation training on the full
# public data mixture. ~302M parameters (15% of the 2B budget).
# Best run on an A100/H100 class GPU; see seer_vitl_local.yaml for 12GB.
#
# The mixture mirrors Pangram Image's data strategy:
#   * comfor        - 4,803 open generators (diversity drives generalization,
#                     CVPR 2025) + paired real images
#   * flux-reason   - FLUX.1-dev fakes (LucasFang/FLUX-Reason-6M), streamed
#   * frontier-fakes - Midjourney / DALL-E / SD / Nano Banana Pro fakes only
#                     (ClassLabel on that repo is inverted: 0=fake, 1=real)
#   * sid-set       - SID_Set full-synthetic only (drop reals and tampered)
#   * ntire         - NTIRE 2026 train, all 6 shards (42 gens, matched reals)
#   * gs-images-v3/v4 - GAS-Station dumps after scripts/wire_gasstation.py
#
# Weights are relative sampling probabilities - tune so that no single
# generator family dominates (the failure mode Pangram explicitly hit).

backbone: facebook/dinov3-vitl16-pretrain-lvd1689m  # gated: accept license + hf auth login
pretrained: true
res: 512
batch_size: 32
grad_accum: 1
max_steps: 60000
lr: 1.0e-5
head_lr: 1.0e-4
llrd: 0.8
weight_decay: 0.05
warmup_steps: 1000
bf16: true
grad_checkpointing: false  # not needed on big GPUs
ema_decay: 0.999
eval_every: 2000
log_every: 50
out_dir: runs/seer_vitl

data:
  source: mixture
  val_max_samples: 4096
  sources:
    - name: comfor
      type: comfor
      dataset: OwensLab/CommunityForensics-Small   # train only; Eval is held out
      local_dirs: [/workspace/data/commfor-small]
      shuffle_buffer: 8192
      weight: 0.35

    - name: flux-reason
      type: hf
      dataset: LucasFang/FLUX-Reason-6M
      image_col: image
      label: 1                 # every row is FLUX.1-dev
      local_dirs: [/workspace/data/flux-reason-6m]
      shuffle_buffer: 2048
      weight: 0.10

    - name: frontier-fakes
      type: hf
      dataset: julienlucas/midjourney-dalle-sd-nanobananapro-dataset
      split: train
      image_col: image
      label_col: label
      # repo ClassLabel: 0=fake, 1=real — invert onto our 0=real / 1=fake
      label_map: {0: 1, 1: 0, fake: 1, real: 0}
      keep_label: 1            # fake images only
      local_dirs: [/workspace/data/frontier-fakes]
      shuffle_buffer: 1024
      weight: 0.07

    - name: sid-set
      type: hf
      dataset: saberzl/SID_Set
      split: train
      image_col: image
      label_col: label
      # 0=real, 1=full synthetic, 2=tampered — keep synthetic only
      label_map: {0: 0, 1: 1}
      keep_label: 1
      local_dirs: [/workspace/data/sid-set]
      shuffle_buffer: 2048
      weight: 0.08

    - name: ntire
      type: ntire
      split: train
      shard: -1                 # all 6 distribution-matched shards
      weight: 0.20

    - name: gs-images-v3
      type: folders             # run: scripts/wire_gasstation.py
      fake_dirs: [/workspace/data/gs-images-v3/wired/images.txt]
      weight: 0.08

    - name: gs-images-v4
      type: folders
      fake_dirs: [/workspace/data/gs-images-v4/wired/images.txt]
      weight: 0.06

augment:
  # benchmark robustness levels (GenImage / OmniAID / Pangram protocols)
  jpeg_prob: 0.75
  jpeg_quality: [90, 70, 50, 30]
  blur_sigma: [0.5, 1.0, 2.0]
  noise_levels: [0.02, 0.05, 0.10]
  downscale_levels: [0.5, 0.25]
  color_jitter: 0.2            # +/-20%
  center_crop_prob: 0.15       # crop 80%
  downscale_prob: 0.30

composite:
  prob: 0.25
  patch_loss_weight: 0.5
  mode: mixed                   # blend (seamless) + paste (hard overlay)
