# Multi-layer linear probe - the cheap ablation / baseline against
# continuation fine-tuning (seer_vitl_512.yaml).
#
# The backbone stays frozen; two independent linear heads are trained on
# features tapped from several transformer blocks: early blocks carry
# high-frequency statistics (where generator fingerprints live), mid and
# late blocks carry increasingly semantic features.
#   page head  - [CLS ; mean(patches)] concatenated across taps -> 1 logit
#   patch head - concatenated patch tokens -> per-patch logits (heatmaps)
# Set head_lr ~1e-3: with a frozen backbone the linear heads want a larger
# LR than fine-tuning heads do.

# Official facebook/dinov3-vitl16-pretrain-lvd1689m is gated (manual review).
# Ungated transformers-format copy of the same ViT-L/16 LVD-1689M weights.
backbone: camenduru/dinov3-vitl16-pretrain-lvd1689m
pretrained: true
res: 512
batch_size: 64          # no backbone grads -> bigger batches fit
grad_accum: 1
max_steps: 20000
head_lr: 1.0e-3
optimizer: muon
weight_decay: 0.05
warmup_steps: 500
bf16: true
grad_checkpointing: false
ema_decay: 0.999
eval_every: 2000
log_every: 10
heatmap_every: 50
heatmap_n: 4
out_dir: runs/seer_probe

probe:
  enabled: true
  layers: []            # auto: evenly spaced taps -> [6, 12, 18, 23] on ViT-L
  # layers: [3, 9, 15, -1]   # explicit: early -> late (0-based, -1 = final block)

decode_workers: 16     # JPEG/aug is the CPU bottleneck; 48 cores available
loader_readers: 4       # parallel mixture iterators (parquet I/O, GIL-free)
prefetch_depth: 6      # collated batches queued ahead of the GPU

data:
  source: mixture
  val_max_samples: 4096
  balance_labels: true  # 50/50 real/fake, then weights within each class
  # Same mixture + weights as seer_vitl_512.yaml (see docs/DATA_MIXTURE.md)
  # so the probe/continuation comparison is honest.
  sources:
    - name: comfor
      type: comfor
      dataset: OwensLab/CommunityForensics-Small   # train only; Eval is held out
      split: train
      local_dirs: [/workspace/data/commfor-small]
      shuffle_buffer: 1024
      weight: 0.26            # ~19% of fake mass + 0.13 reals (was 0.35)

    - name: flux-reason
      type: hf
      dataset: LucasFang/FLUX-Reason-6M
      image_col: image
      label: 1
      local_dirs: [/workspace/data/flux-reason-6m]
      shuffle_buffer: 512
      weight: 0.05            # single 2024 family; kept below sid-set

    - name: frontier-fakes
      type: hf
      dataset: julienlucas/midjourney-dalle-sd-nanobananapro-dataset
      split: train
      image_col: image
      label_col: label
      label_map: {0: 1, 1: 0, fake: 1, real: 0}
      keep_label: 1
      local_dirs: [/workspace/data/frontier-fakes]
      shuffle_buffer: 256
      weight: 0.08            # frontier commercial; capped by ~5k train fakes

    - name: sid-set
      type: hf
      dataset: saberzl/SID_Set
      split: train
      image_col: image
      label_col: label
      # 0=real, 1=full synthetic, 2=tampered — keep synthetic only
      label_map: {0: 0, 1: 1}
      keep_label: 1
      local_dirs: [/workspace/data/sid-set]
      shuffle_buffer: 512
      weight: 0.06            # untagged, older-skew generators

    - name: ntire
      type: ntire
      split: train
      shard: -1
      weight: 0.30              # most recent curated set; 42 gens 2022-2026 + matched reals

    - name: gs-images-v3
      type: folders             # run: scripts/wire_gasstation.py
      fake_dirs: [/workspace/data/gs-images-v3/wired/images.txt]
      weight: 0.10              # recent open-model dumps

    - name: gs-images-v4
      type: folders
      fake_dirs: [/workspace/data/gs-images-v4/wired/images.txt]
      weight: 0.11              # latest weekly dumps - highest recency

    - name: laion400m-1
      type: folders
      real_dirs: [/workspace/data/laion400m-1/real]
      weight: 0.10

    - name: open-images-v7
      type: folders             # scripts/download_open_images.py (val + test)
      real_dirs: [/workspace/data/open-images-v7]
      weight: 0.10

augment:
  jpeg_prob: 0.75
  jpeg_quality: [90, 70, 50, 30]
  blur_sigma: [0.5, 1.0, 2.0]
  noise_levels: [0.02, 0.05, 0.10]
  downscale_levels: [0.5, 0.25]
  color_jitter: 0.2
  center_crop_prob: 0.15
  downscale_prob: 0.30

composite:
  prob: 0.60                 # more fakes become overlays
  fake_on_real: 0.50
  real_on_fake: 0.35         # inverted labels — as important as FoR
  fake_on_fake: 0.15         # keep some seam-negative
  real_real_fraction: 0.20   # RoR ≈ 12% of reals; do not match `prob`
  max_overlays: 3            # n ~ Uniform{1,...,k} pastes per composite
  patch_loss_weight: 1.0     # patch probe trains on composite heatmaps
  balance_patch: true            # pos_weight = n_real_patches / n_fake_patches
  mode: mixed
