# Seer on a single 12GB GPU (e.g. RTX 4070): DINOv3 ViT-L with
# gradient checkpointing + small micro-batch + accumulation.

backbone: facebook/dinov3-vitl16-pretrain-lvd1689m
pretrained: true
res: 512
batch_size: 4
grad_accum: 8               # effective batch 32
max_steps: 20000
lr: 1.0e-5
head_lr: 1.0e-4
llrd: 0.8
warmup_steps: 500
bf16: true
grad_checkpointing: true
ema_decay: 0.999
eval_every: 1000
log_every: 20
out_dir: runs/seer_vitl_local

data:
  shuffle_buffer: 4096
  val_max_samples: 1024

composite:
  prob: 0.25
