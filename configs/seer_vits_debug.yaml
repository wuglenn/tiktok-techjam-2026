# Quick sanity/debug recipe - open DINOv2-S backbone (no HF auth needed),
# streams a small slice of Community Forensics, runs in minutes on 12GB.

backbone: facebook/dinov2-small
pretrained: true
res: 224
batch_size: 32
grad_accum: 1
max_steps: 300
lr: 3.0e-5
head_lr: 3.0e-4
llrd: 0.8
warmup_steps: 30
bf16: true
grad_checkpointing: true
ema_decay: 0.999
eval_every: 100
log_every: 10
out_dir: runs/seer_debug

data:
  source: comfor
  dataset: OwensLab/CommunityForensics-Small
  split: train
  local_dirs: [/workspace/data/commfor-small]
  shuffle_buffer: 2048
  max_samples: 20000
  val_max_samples: 512

composite:
  prob: 0.25
